[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradelab"
version = "0.1.0"
description = "Laboratório quantitativo e plataforma de simulação de estratégias financeiras."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kelverly França dos Santos" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "fastapi>=0.110",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.35",
    "plotly>=5.20",
]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
    "uvicorn>=0.29",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.vercel]
entrypoint = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
